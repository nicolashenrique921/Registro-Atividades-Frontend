<h2>
  {{ id ? 'Editar atividade' : 'Nova atividade' }}
</h2>

<form (ngSubmit)="salvar()" class="form">
  <input
    type="text"
    name="titulo"
    [(ngModel)]="atividade.titulo"
    placeholder="Título"
    required
  />

  <textarea
    name="descricao"
    [(ngModel)]="atividade.descricao"
    placeholder="Descrição"
  ></textarea>

  <button type="submit">
    {{ id ? 'Atualizar' : 'Salvar' }}
  </button>
</form>
