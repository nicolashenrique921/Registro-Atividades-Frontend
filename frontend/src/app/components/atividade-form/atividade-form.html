<div class="form-container">

  <h2>{{ id ? 'Editar atividade' : 'Nova atividade' }}</h2>

  <form (ngSubmit)="salvar()">

    <!-- TÍTULO -->
    <label for="titulo">Título</label>
    <input
      id="titulo"
      type="text"
      name="titulo"
      [(ngModel)]="atividade.titulo"
      (blur)="tituloTouched = true; validarTitulo()"
      [class.erro]="tituloInvalido || tituloDuplicado"
      placeholder="Ex: Reunião com equipe"
    />

    @if (tituloInvalido) {
      <small class="erro-msg">Título é obrigatório.</small>
    }

    @if (validandoTitulo) {
      <small class="info">Validando título...</small>
    }

    @if (tituloDuplicado) {
      <small class="erro-msg">Título já existe.</small>
    }

    <!-- DESCRIÇÃO -->
    <label for="descricao">Descrição</label>
    <textarea
      id="descricao"
      name="descricao"
      [(ngModel)]="atividade.descricao"
      (blur)="descricaoTouched = true"
      placeholder="Descreva a atividade..."
    ></textarea>

    @if (descricaoInvalida) {
      <small class="erro-msg">Máximo de 500 caracteres.</small>
    }

    <!-- AÇÕES -->
    <div class="acoes">
      <button
        type="submit"
        [disabled]="salvando || tituloDuplicado || validandoTitulo"
      >
        {{ salvando ? 'Salvando...' : 'Salvar' }}
      </button>

      <a routerLink="/atividades">Cancelar</a>
    </div>

  </form>
</div>
