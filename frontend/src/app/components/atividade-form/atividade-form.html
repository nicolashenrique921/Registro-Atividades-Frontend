<form (ngSubmit)="salvar()" class="form">
  <input
    type="text"
    name="titulo"
    [(ngModel)]="atividade.titulo"
    placeholder="Título da atividade"
    required
  />

  <textarea
    name="descricao"
    [(ngModel)]="atividade.descricao"
    placeholder="Descrição"
  ></textarea>

  <button type="submit">
    Salvar atividade
  </button>
</form>
