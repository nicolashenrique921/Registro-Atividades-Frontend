<h2>Nova Atividade</h2>

<form (ngSubmit)="salvar()">
  <input type="text"
         placeholder="Título"
         [(ngModel)]="atividade.titulo"
         name="titulo"
         required />

  <textarea placeholder="Descrição"
            [(ngModel)]="atividade.descricao"
            name="descricao">
  </textarea>

  <button type="submit">Salvar</button>

  <a routerLink="/atividades" class="voltar">← Voltar</a>
</form>
