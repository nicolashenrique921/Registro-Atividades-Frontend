<div class="container">
  <h2>
    {{ editando ? 'Editar atividade' : 'Nova atividade' }}
  </h2>

  <form (ngSubmit)="salvar()">

    <label>
      Título
      <input
        type="text"
        [(ngModel)]="atividade.titulo"
        name="titulo"
        required
        placeholder="Digite o título"
      />
    </label>

    <label>
      Descrição
      <textarea
        [(ngModel)]="atividade.descricao"
        name="descricao"
        rows="4"
        placeholder="Descrição opcional"
      ></textarea>
    </label>

    <div class="acoes">
      <button
        type="submit"
        [disabled]="salvando"
        class="salvar"
      >
        {{ salvando
            ? 'Salvando...'
            : (editando ? 'Atualizar' : 'Salvar') }}
      </button>

      <a routerLink="/atividades" class="cancelar">
        Cancelar
      </a>
    </div>

  </form>
</div>
