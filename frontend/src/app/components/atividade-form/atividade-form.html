<div class="container">

  <h2>
    {{ editando ? 'Editar atividade' : 'Nova atividade' }}
  </h2>

  <form (ngSubmit)="salvar()">

    <label>
      Título
      <input
        type="text"
        [(ngModel)]="atividade.titulo"
        name="titulo"
        required
      />
    </label>

    <label>
      Descrição
      <textarea
        [(ngModel)]="atividade.descricao"
        name="descricao"
        rows="4"
      ></textarea>
    </label>

    <div class="acoes">
      <button type="submit" class="salvar">
        {{ editando ? 'Atualizar' : 'Salvar' }}
      </button>

      <a routerLink="/atividades" class="cancelar">
        Cancelar
      </a>
    </div>

  </form>

</div>
