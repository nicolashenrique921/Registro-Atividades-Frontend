<div class="filtros">
  <input
    type="text"
    placeholder="Buscar por título"
    [(ngModel)]="busca"
    (input)="buscar()"
  />

  <button (click)="alterarOrdenacao('data')">Mais recentes</button>
  <button (click)="alterarOrdenacao('titulo')">Título</button>
</div>

@if (atividades.length === 0) {
  <p class="aviso">Nenhuma atividade encontrada.</p>
}

<ul>
  @for (atividade of atividades; track atividade._id) {
    <li>
      <h3>{{ atividade.titulo }}</h3>
      <p>{{ atividade.descricao }}</p>
      <small>{{ atividade.data | date:'short' }}</small>
      <button (click)="remover(atividade._id)">Excluir</button>
    </li>
  }
</ul>

<div class="paginacao">
  <button (click)="paginaAnterior()" [disabled]="paginaAtual === 1">
    Anterior
  </button>

  <span>Página {{ paginaAtual }} de {{ totalPaginas }}</span>

  <button
    (click)="proximaPagina()"
    [disabled]="paginaAtual === totalPaginas"
  >
    Próxima
  </button>
</div>
