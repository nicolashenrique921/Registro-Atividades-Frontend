<ul class="lista">
  @for (atividade of atividades; track atividade._id) {
    <li class="item">
      <div>
        <strong>{{ atividade.titulo }}</strong>
        <p>{{ atividade.descricao }}</p>
      </div>

      <button (click)="remover(atividade._id!)">
        Remover
      </button>
    </li>
  }
</ul>

@if (!atividades.length) {
  <p class="vazio">Nenhuma atividade cadastrada.</p>
}
