<h2>Atividades do Dia</h2>

<ul>
  @for (a of atividades; track a._id) {
    <li>
      <strong>{{ a.titulo }}</strong>
      <p>{{ a.descricao }}</p>

      <button (click)="remover(a._id!)">Excluir</button>
    </li>
  }
</ul>

<a routerLink="/AtividadeForm" class="nova">+ Nova Atividade</a>
<a routerLink="/atividades" class="voltar">← Voltar</a>
